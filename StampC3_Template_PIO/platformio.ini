; PlatformIO project for the supplied SEMT0043 StampC3 template.
; The sketch sources are used in place from the RoboticsScienceAndSystems
; folder, so edits there are picked up directly - nothing is copied.

[platformio]
src_dir = ../RoboticsScienceAndSystems/StampC3_Template

[env:m5stack-stamp-c3]
platform = espressif32
board = m5stack-stamp-c3
framework = arduino

; Serial monitor. Keep DTR/RTS deasserted, otherwise opening the port holds
; the StampC3 in reset and no output appears.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0

; The checklist recommends 115200 if uploading is unreliable.
; Remove this line to go back to the default 921600.
upload_speed = 115200

; Pololu libraries for the 3Pi+ IMU (accelerometer/gyro + magnetometer).
lib_deps =
    pololu/LSM6@^2.0.1
    pololu/LIS3MDL@^2.0.0

; "Tools > USB-CDC On Boot > Disabled" from the checklist.
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
